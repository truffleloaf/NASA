name: backend-data-check

on:
  pull_request:
    paths:
      - "public/data/**"
      - "backend/**"
      - "scripts/**"
      - "docs/DATA.md"
      - ".github/workflows/backend-data-check.yml"
  push:
    branches:
      - main
      - "backend/**"
    paths:
      - "public/data/**"
      - "backend/**"
      - "scripts/**"
      - "docs/DATA.md"
      - ".github/workflows/backend-data-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-product:
    name: 40 m cross-product check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/pipeline

      - name: Cache 40 m LOLA DEM
        uses: actions/cache@v4
        with:
          path: backend/data/dem
          key: ldem-85s-40m-v1

      - name: Download LOLA DEM (resumes on a cache miss)
        run: python backend/pipeline/fetch_dem.py

      - name: Cross-product check
        run: python backend/pipeline/cross_product.py --check

      - name: Confirm the check did not write public/data
        run: git diff --exit-code -- public/data
