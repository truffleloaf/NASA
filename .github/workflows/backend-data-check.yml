name: backend-data-check

on:
  pull_request:
    paths:
      - "public/data/**"
      - "backend/**"
      - "scripts/**"
      - "schema/**"
      - "docs/DATA.md"
      - ".github/workflows/backend-data-check.yml"
  push:
    branches: [main]
    paths:
      - "public/data/**"
      - "backend/**"
      - "scripts/**"
      - "schema/**"
      - "docs/DATA.md"
      - ".github/workflows/backend-data-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-product:
    name: 40 m cross-product check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/pipeline

      - name: Schema validator self-test
        run: python scripts/check_schema.py --self-test

      - name: Validate bundled data against the contract
        run: python scripts/check_data.py

      - name: Cache 40 m LOLA DEM
        uses: actions/cache@v4
        with:
          path: |
            backend/data/dem/ldem_80s_40m.img
            backend/data/dem/ldem_80s_40m.lbl
          key: ldem-80s-40m-v1

      - name: Download and verify LOLA DEM
        run: python backend/pipeline/fetch_dem.py --product 80s

      - name: Cross-product check
        run: python backend/pipeline/cross_product.py --check

      - name: Confirm the check did not write public/data
        run: test -z "$(git status --porcelain -- public/data)"

  frontend:
    name: Frontend tests, typecheck and static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Contract types are current
        run: npm run check:contract

      - name: Unit and bundled-data tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Static build
        run: npm run build
